name: build-windows
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to publish as a pre-release (leave empty to only build)
        required: false
        default: ""
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install pyinstaller pywebview
      - run: pip install pytest
      - run: python -m pytest -q
      - run: pyinstaller packaging/workbench.spec --noconfirm
      - name: Smoke test the built app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\SL-Health-LLM-Eval-Workbench\SL-Health-LLM-Eval-Workbench.exe" -ArgumentList "--no-window" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "app exited early" }
          Stop-Process -Id $p.Id -Force
      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path dist\SL-Health-LLM-Eval-Workbench -DestinationPath dist\SL-Health-LLM-Eval-Workbench-win64.zip
      - name: Build installer (best effort)
        shell: pwsh
        continue-on-error: true
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-windows
          path: |
            dist/SL-Health-LLM-Eval-Workbench-win64.zip
            dist/SL-Health-LLM-Eval-Workbench-Setup.exe
      - name: Publish pre-release
        if: ${{ inputs.release_tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Pilot release of the SL-Health-LLM-Eval Evaluation Workbench for Windows.`n`nUnsigned build: Windows SmartScreen may warn. Choose More info, then Run anyway, only if you downloaded this from this repository.`n`nItems are author-approved only, with no independent review. See docs/LIMITATIONS.md."
          $files = @("dist\SL-Health-LLM-Eval-Workbench-win64.zip")
          if (Test-Path "dist\SL-Health-LLM-Eval-Workbench-Setup.exe") { $files += "dist\SL-Health-LLM-Eval-Workbench-Setup.exe" }
          gh release create "${{ inputs.release_tag }}" @files --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease --title "Evaluation Workbench ${{ inputs.release_tag }} (pilot, unsigned)" --notes "$notes"
